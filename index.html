<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAZOX TV</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    text-align:center;
}

.container{
    padding:50px 20px;
}

.btn{
    display:block;
    width:300px;
    margin:20px auto;
    padding:20px;
    font-size:22px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.tv{
    background:#007bff;
    color:white;
}

.football{
    background:#28a745;
    color:white;
}

iframe{
    width:100%;
    height:100vh;
    border:none;
}
</style>
</head>

<body>

<div class="container" id="menu">
    <h1>HAZOX TV</h1>
    <h2>What do you want to watch?</h2>

    <button class="btn tv" onclick="openTV()">
        📺 Live TV
    </button>

    <button class="btn football" onclick="openFootball()">
        ⚽ Live Football Match
    </button>
</div>

<div id="player"></div>

<script>

function openTV(){
    window.location.href="iptv.html";
}

function openFootball(){

    document.getElementById("menu").style.display="none";

    document.getElementById("player").innerHTML=`
        <iframe
            src="https://koora-livex.watch/"
            allowfullscreen>
        </iframe>
    `;
}

</script>

</body>
</html>

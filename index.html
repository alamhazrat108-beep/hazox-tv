<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAZOX TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:#111;border-bottom:1px solid #222}
.logo{display:flex;align-items:center;gap:12px}
.badge{width:42px;height:42px;border-radius:10px;background:#e50914;display:flex;align-items:center;justify-content:center;font-weight:bold}
h1{margin:0;color:#e50914}
.sub{font-size:12px;color:#aaa}
.support{background:#e50914;color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none}
.wrap{display:flex;height:calc(100vh - 74px)}
.sidebar{width:340px;background:#151515;padding:12px;overflow:auto}
.player{flex:1;padding:16px}
input{width:100%;padding:12px;border:none;border-radius:10px;background:#222;color:#fff}
.channel{padding:12px;background:#1f1f1f;border-radius:10px;margin-top:8px;cursor:pointer}
.channel:hover{background:#333}
video{width:100%;height:72vh;background:#000;border-radius:14px}
@media(max-width:900px){.wrap{flex-direction:column}.sidebar{width:100%;height:40%}video{height:35vh}}
</style>
</head>
<body>
<header>
<div class="logo">
<div class="badge">H</div>
<div>
<h1>HAZOX TV</h1>
<div class="sub">Created by Hazox Enterprises</div>
</div>
</div>
<a class="support" href="https://razorpay.me/@hazoxenterprises" target="_blank">Support ❤️</a>
</header>

<div class="wrap">
<div class="sidebar">
<input id="search" placeholder="Search channels..." onkeyup="filterChannels()">
<div id="channels"></div>
</div>
<div class="player">
<h2 id="title">Loading playlist...</h2>
<video id="video" controls autoplay></video>
</div>
</div>

<script>
let channels=[];

async function loadPlaylist(){
 try{
   const res=await fetch('https://iptv-org.github.io/iptv/index.m3u');
   const txt=await res.text();
   parseM3U(txt);
 }catch(e){
   document.getElementById('title').innerText='Playlist blocked by browser/CORS';
 }
}

function parseM3U(text){
 const lines=text.split(/\r?\n/);
 for(let i=0;i<lines.length;i++){
   if(lines[i].startsWith('#EXTINF')){
      const name=(lines[i].split(',').pop()||'Unknown').trim();
      const url=(lines[i+1]||'').trim();
      if(url.startsWith('http')) channels.push({name,url});
   }
 }
 render(channels.slice(0,1000));
 document.getElementById('title').innerText='Select a channel';
}

function render(list){
 const c=document.getElementById('channels');
 c.innerHTML='';
 list.forEach(ch=>{
   const d=document.createElement('div');
   d.className='channel';
   d.textContent=ch.name;
   d.onclick=()=>play(ch);
   c.appendChild(d);
 });
}

function filterChannels(){
 const q=document.getElementById('search').value.toLowerCase();
 render(channels.filter(x=>x.name.toLowerCase().includes(q)));
}

function play(ch){
 document.getElementById('title').innerText=ch.name;
 const v=document.getElementById('video');
 if(window.Hls && Hls.isSupported()){
   const hls=new Hls();
   hls.loadSource(ch.url);
   hls.attachMedia(v);
 } else {
   v.src=ch.url;
 }
}

loadPlaylist();
</script>
</body>
</html>
